{% extends "base.html" %}
{% block title %}Admin panel{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6">
  <h1 class="text-lg font-semibold">Admin panel</h1>
  <form method="post" action="{{ url_for('admin_logout') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <button class="btn text-sm px-3 py-1.5 rounded-lg border border-stone-200 dark:border-neutral-700">Chiqish</button>
  </form>
</div>

<form method="post" action="{{ url_for('admin_create_post') }}" enctype="multipart/form-data" class="grid gap-3 rounded-2xl bg-white dark:bg-neutral-900 border border-stone-200 dark:border-neutral-800 p-5">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <input name="title" required maxlength="200" placeholder="Sarlavha" class="rounded-lg border border-stone-200 dark:border-neutral-700 bg-transparent px-3 py-2 text-sm">
  <textarea name="body" required rows="6" placeholder="Matn" class="rounded-lg border border-stone-200 dark:border-neutral-700 bg-transparent px-3 py-2 text-sm"></textarea>
  <input name="image" type="file" accept="image/png,image/jpeg,image/gif,image/webp" class="text-sm">
  <button class="btn justify-self-end px-4 py-2 rounded-lg bg-stone-900 text-white dark:bg-stone-100 dark:text-neutral-900 text-sm">Joylash</button>
</form>

<h2 class="mt-10 mb-3 text-sm font-medium text-stone-500">Mavjud postlar</h2>
<ul class="divide-y divide-stone-200 dark:divide-neutral-800">
{% for p in posts %}
  <li class="py-3 flex items-center justify-between gap-3">
    <span class="truncate text-sm">{{ p.title }} <span class="text-xs text-stone-500">· {{ p.created_at | date }}</span></span>
    <form method="post" action="{{ url_for('admin_delete_post', post_id=p.id) }}" onsubmit="return confirm('Post o\'chirilsinmi?')">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <button class="btn text-xs px-3 py-1 rounded-lg border border-red-300 text-red-600">O'chirish</button>
    </form>
  </li>
{% else %}
  <li class="py-3 text-sm text-stone-500">Postlar yo'q.</li>
{% endfor %}
</ul>
{% endblock %}
