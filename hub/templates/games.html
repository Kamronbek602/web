{% extends "base.html" %}
{% block title %}Hub — O'yinlar{% endblock %}
{% block content %}
<div class="space-y-8">
  <section class="reveal rounded-2xl bg-white dark:bg-neutral-900 border border-stone-200 dark:border-neutral-800 p-5">
    <h2 class="text-lg font-semibold">Reaksiya tezligi</h2>
    <p class="text-sm text-stone-500 mt-1">Maydon yashil bo'lishi bilan bosing.</p>
    <button id="rt-pad" class="rt-wait mt-4 w-full h-48 rounded-xl text-white font-medium select-none touch-manipulation">Boshlash uchun bosing</button>
    <p class="mt-3 text-sm text-stone-500">Eng yaxshi natija: <span id="rt-best">—</span></p>
  </section>

  <section class="reveal rounded-2xl bg-white dark:bg-neutral-900 border border-stone-200 dark:border-neutral-800 p-5">
    <h2 class="text-lg font-semibold">Raqamni top</h2>
    <p class="text-sm text-stone-500 mt-1">1 dan 100 gacha son o'ylandi. 7 ta urinish bor.</p>
    <form id="ng-form" class="mt-4 flex gap-2">
      <input id="ng-input" type="number" inputmode="numeric" min="1" max="100" required class="flex-1 rounded-lg border border-stone-200 dark:border-neutral-700 bg-transparent px-3 py-2 text-base">
      <button class="btn px-4 py-2 rounded-lg bg-stone-900 text-white dark:bg-stone-100 dark:text-neutral-900 text-sm">Tekshirish</button>
    </form>
    <p id="ng-msg" class="mt-3 text-sm min-h-[1.25rem]"></p>
    <div class="flex items-center justify-between mt-1">
      <span class="text-sm text-stone-500">Qolgan urinish: <span id="ng-left">7</span></span>
      <button id="ng-reset" class="btn text-sm px-3 py-1 rounded-lg border border-stone-200 dark:border-neutral-700">Qayta</button>
    </div>
  </section>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/games.js') }}"></script>{% endblock %}
