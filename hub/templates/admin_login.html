{% extends "base.html" %}
{% block title %}Kirish{% endblock %}
{% block content %}
<form method="post" class="max-w-sm mx-auto mt-16 grid gap-3 rounded-2xl bg-white dark:bg-neutral-900 border border-stone-200 dark:border-neutral-800 p-6">
  <h1 class="text-lg font-semibold">Admin</h1>
  {% if error %}<p class="text-sm text-red-500">{{ error }}</p>{% endif %}
  <input name="username" autocomplete="username" required placeholder="Login" class="rounded-lg border border-stone-200 dark:border-neutral-700 bg-transparent px-3 py-2 text-sm">
  <input name="password" type="password" autocomplete="current-password" required placeholder="Parol" class="rounded-lg border border-stone-200 dark:border-neutral-700 bg-transparent px-3 py-2 text-sm">
  <button class="btn px-4 py-2 rounded-lg bg-stone-900 text-white dark:bg-stone-100 dark:text-neutral-900 text-sm">Kirish</button>
</form>
{% endblock %}
